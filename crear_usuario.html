<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="icon" type="image/x-icon" href="Dorado.png">
</head>
<body>
    <div class="app">

        <!-- navbar -->
        <header class="navbar">
            <div class="navbar-brand">
                <img src="img/Hidalgo_Economia_AEEH.png" alt="Hidalgo · Economía · AEEH">
            </div>

            <nav>
                <ul class="navbar-links">
                    <li><a href="dashboard.html">Inicio</a></li>
                    <li><a href="dashboard.html">Trámites</a></li>
                    <li><a href="calendario.html">Calendario</a></li>
                    <li><a href="directorio.html">Directorio</a></li>
                    <li><a href="ayuda.html">Ayuda</a></li>
                </ul>
            </nav>

            <div class="navbar-actions">
                <button type="button" class="notif-btn" id="notif-btn" aria-label="Notificaciones">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span class="notif-badge">3</span>
                </button>

                <div class="dropdown">
                    <div class="navbar-user d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer;">
                        <!-- círculo del avatar -->
                        <div class="avatar" id="user-iniciales">--</div>
                        <div class="user-meta">
                            <!-- nombre principal -->
                            <span id="user-nombre">cargando...</span>

                            <!-- ubicación -->
                            <span id="user-ubicacion">cargando...</span>
                        </div>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 py-2 mt-2" style="border-radius: 12px; min-width: 180px;">
                        <li>
                            <a class="dropdown-item d-flex align-items-center gap-2 text-danger py-2 fw-semibold" href="#" onclick="cerrar_sesion()" style="color: #691b31;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                                Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </div>
        </header>

        <!-- main container -->
        <main class="registro-container py-4 px-3 px-md-5 container-fluid" style="max-width: 1400px;">
            <div class="breadcrumb-trail mb-2">
                <a href="dashboard.html" class="text-decoration-none text-muted">Inicio</a> <span class="mx-1">›</span> 
                <span class="fw-semibold" style="color: #691b31;">Crear Cuenta</span>
            </div>
            
            <h1 class="page-main-title mb-4" style="font-family: 'gmx', serif; font-weight: 900; font-size: 36px; color: #111111;">Crear Cuenta</h1>

            <div class="card p-4 shadow-sm border-0 mb-5" style="border-radius: 16px; border-top: 6px solid #691b31; background: #ffffff;">
                <div class="mb-4 pb-3 border-bottom">
                    <h2 class="section-title m-0" style="font-family: 'gmx', serif; font-weight: 700; font-size: 22px; color: #691b31;">Datos del Nuevo Usuario</h2>
                </div>

                <form id="form-crear-usuario">
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold small">Nombre(s)</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Escriba el nombre" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold small">Apellido Paterno</label>
                            <input type="text" class="form-control" id="apellido_paterno" name="apellido_paterno" placeholder="Escriba el apellido paterno" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold small">Apellido Materno</label>
                            <input type="text" class="form-control" id="apellido_materno" name="apellido_materno" placeholder="Escriba el apellido materno">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Número de Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ej.7711265985">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Correo Electrónico</label>
                            <input type="email" class="form-control" id="correo" name="correo" placeholder="usuario@hidalgo.gob.mx" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Nombre de Usuario</label>
                            <input type="text" class="form-control" id="nombre_usuario" name="nombre_usuario" placeholder="ej.agencia_estatal" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Nivel de Acceso</label>
                            <select class="form-select" id="nivel_acceso" name="nivel_acceso" required>
                                <option value="" selected disabled>Seleccione el nivel de acceso</option>
                                <option value="administrador">Administrador</option>
                                <option value="supervisor">Supervisor</option>
                                <option value="capturista">Capturista</option>
                                <option value="consulta">Consulta</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Puesto en la Empresa</label>
                        <input type="text" class="form-control" id="cargo-real" name="cargo_real" required>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Contraseña</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••••••" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="alternar_pass('password', this)">👁</button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Confirmar Contraseña</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="confirmar_password" name="confirmar_password" placeholder="••••••••••••" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="alternar_pass('confirmar_password', this)">👁</button>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-4 align-items-center">
                        <div class="col-md-12">
                            <label class="form-label fw-semibold small d-block">Estado de la cuenta</label>
                            <div class="form-check form-switch d-flex align-items-center gap-3">
                                <input class="form-check-input" type="checkbox" role="switch" id="estado_cuenta" name="estado_cuenta" checked style="width: 48px; height: 24px;">
                                <label class="form-check-label text-muted small" for="estado_cuenta">Cuenta activa</label>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 d-flex align-items-center mt-4 pt-3 border-top flex-wrap gap-2">
                        <div class="ms-auto d-flex gap-2">
                            <a href="dashboard.html" class="btn btn-outline-secondary px-4" style="border-radius: 8px;">Cancelar</a>
                            <button type="submit" class="btn text-white px-4 fw-semibold" style="background-color: #691b31; border-radius: 8px;">Crear Cuenta</button>
                        </div>
                    </div>
                </form>
            </div>
        </main>

        <!-- footer -->
        <footer class="app-footer">
            <span>© 2026 Agencia Estatal de Energía de Hidalgo. Todos los derechos reservados.</span>
            <div class="footer-brand">
                <img src="img/Armas.png" alt="">
            </div>
            <div class="footer-links">
                <a href="aviso-privacidad.html">Aviso de privacidad</a>
                <a href="terminos.html">Términos de uso</a>
            </div>
            <div class="footer-brand">
                <img src="img/dpie.png" alt="dirección de proyectos e infraestructura energética">
            </div>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/crear_usuario.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/alertas.js"></script>
    <script>
        function alternar_pass(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }
    </script>
</body>
</html>
