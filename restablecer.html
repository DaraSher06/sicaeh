<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña · SICAEH</title>
    <!-- bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" type="image/x-icon" href="../Dorado.png">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="card shadow-sm p-4 border-0" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <div class="text-center mb-4">
            <img src="img/hidalgo_economia_aeeh.png" alt="sigeah" style="max-height: 35px;">
        </div>
        <h2 class="h5 text-center fw-bold mb-3" style="color: #691b31;">Restablecer Contraseña</h2>
        
        <div id="mensaje" class="alert alert-info text-center small" role="alert">Verificando Enlace...</div>

        <form id="form-restablecer" class="d-none" novalidate>
            <input type="text" name="username" autocomplete="username" style="display: none;" aria-hidden="true">
            <input type="hidden" id="token" value="">

            <div class="mb-3">
                <label for="nueva_contrasena" class="form-label small fw-semibold">Nueva contraseña</label>
                <div class="input-wrap">
                    <input type="password" class="form-control" id="nueva_contrasena" name="nueva_contrasena" autocomplete="new-password" required style="border-radius: 8px;">
                    <button type="button" class="toggle-password" id="toggle-nueva" aria-label="mostrar contraseña">
                        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.06 4.28M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label for="confirmar_contrasena" class="form-label small fw-semibold">Confirmar contraseña</label>
                <div class="input-wrap">
                    <input type="password" class="form-control" id="confirmar_contrasena" name="confirmar_contrasena" autocomplete="new-password" required style="border-radius: 8px;">
                    <button type="button" class="toggle-password" id="toggle-confirmar" aria-label="mostrar contraseña">
                        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.06 4.28M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn w-100 text-white fw-semibold py-2" style="background-color: #691b31; border-radius: 8px;">Actualizar contraseña</button>
        </form>

        <div class="text-center mt-3">
            <a href="login.html" class="small text-decoration-none" style="color: #691b31;">Ir al Inicio de Sesión</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/restablecer.js"></script>
</body>
</html>
